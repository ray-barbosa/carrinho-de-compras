<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Carrinho de Compras</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        </style>
    </head>
    <body>
        <!-- Conteúdo do carrinho de compras vai aqui -->
        
        <div id="cart-container">
            <section>
                <h3>Seu carrinho tem 5 itens</h3>
            </section>
            <hr>
            <div id="cart-items">
                <!-- Produto 1 -->
                <div class="container-produto">
                    
                    <img class="produtoCarrinho" src="images/product-image-cadeira.jpg" alt="Imagem do Produto 1">
                    <p>Produto 1</p>
                    <p id="valor-produto1">R$ 100,00</p>
                    <div class="botoes-carrinho">
                        <button class="minus"><img src="assets/icons/Minus.svg" alt="minus-button"></button>
                        2
                        <button class="plus"><img src="assets/icons/Plus.svg" alt="plus-button"></button>
                    </div>
                </div>

                <!-- Produto 2 -->
                 <div class="container-produto">
                    
                    <img class="produtoCarrinho" src="images/product-image-headset.jpg" alt="Imagem do Produto 2">
                    <p>Produto 2</p>
                    <p id="valor-produto-2">R$ 50,00</p>
                    <div class="botoes-carrinho">
                        <button class="minus"><img src="assets/icons/Minus.svg" alt="minus-button"></button>
                        1
                        <button class="plus"><img src="assets/icons/Plus.svg" alt="plus-button"></button>
                    </div>
                </div>

                <!-- Produto 3 -->
                 <div class="container-produto">
                    
                    <img class="produtoCarrinho" src="images/product-image-monitor.jpg" alt="Imagem do Produto 3">
                    <p>Produto 3</p>
                    <p id="valor-produto-3">R$ 50,00</p>
                    <div class="botoes-carrinho">
                        <button class="minus"><img src="assets/icons/Minus.svg" alt="minus-button"></button>
                        1
                        <button class="plus"><img src="assets/icons/Plus.svg" alt="plus-button"></button>
                    </div>
                </div>

                <!-- Produto 4 -->
                 <div class="container-produto">
                    
                    <img class="produtoCarrinho" src="images/product-image-teclado.jpg" alt="Imagem do Produto 4">
                    <p>Produto 4</p>
                    <p id="valor-produto-4">$ 30,00</p>
                    <div class="produtoCarrinho" class="botoes-carrinho">
                        <button class="minus"><img src="assets/icons/Minus.svg" alt="minus-button"></button> 
                        1 
                        <button class="plus"><img src="assets/icons/Plus.svg" alt="plus-button"></button>
                    </div>
                </div>

                <!-- Produto 5 -->
                 <div class="container-produto">
                    
                    <img class="produtoCarrinho" src="images/product-image-patinho.png" alt="Imagem do Produto 5 ">
                    <p>Produto 5</p>
                    <p id="valor-produto-5">R$ 20,00</p>
                    <div class="botoes-carrinho">
                        <button class="minus"><img src="assets/icons/Minus.svg" alt="minus-button"></button>
                        1
                        <button class="plus"><img src="assets/icons/Plus.svg" alt="plus-button"></button>
                    </div>
                </div>
            </div>
            <div class="container-checkout">
                <section class="section-total">
                    <h2 id="valor-total-carrinho" >Total:    R$ 250,00</h2>
                    <p id="validar-desconto" class="discount"><img class="discount-tag" src="assets/icons/Tag.svg" alt="discount-tag"> Adicionar cupom</p>
                </section>
                <button id="checkout-button">Finalizar Compra</button>
            </div>
        </div>
    </body>
</html>
